<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Sử Phiên Tài Xỉu</title>
<style>
  :root{
    --bg:#0b1020;
    --bg2:#121a33;
    --card:#161f3d;
    --line:#25304f;
    --text:#e8edff;
    --muted:#8b97bd;
    --tai:#ff4d4f;
    --tai2:#ff8a3d;
    --xiu:#2f7bff;
    --xiu2:#39c5ff;
    --ok:#22c55e;
    --warn:#f59e0b;
    --err:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2650 0%,var(--bg) 55%) fixed;
    color:var(--text);
    min-height:100vh;
    padding:16px;
  }
  .wrap{max-width:1100px;margin:0 auto}

  /* ---------- HEADER ---------- */
  header{
    display:flex;flex-wrap:wrap;gap:12px;
    align-items:center;justify-content:space-between;
    margin-bottom:16px;
  }
  h1{
    font-size:clamp(18px,4vw,26px);
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--tai2),#fff,var(--xiu2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .status{
    display:flex;align-items:center;gap:8px;
    font-size:13px;color:var(--muted);
    background:var(--card);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;
  }
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 8px currentColor}
  .dot.ok{background:var(--ok);color:var(--ok)}
  .dot.warn{background:var(--warn);color:var(--warn)}
  .dot.err{background:var(--err);color:var(--err)}
  .dot.load{background:var(--xiu2);color:var(--xiu2);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}

  /* ---------- STATS ---------- */
  .stats{
    display:grid;gap:12px;margin-bottom:16px;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  }
  .stat{
    background:linear-gradient(160deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:16px;
    padding:14px 16px;position:relative;overflow:hidden;
  }
  .stat::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--line)}
  .stat.tai::after{background:linear-gradient(90deg,var(--tai),var(--tai2))}
  .stat.xiu::after{background:linear-gradient(90deg,var(--xiu),var(--xiu2))}
  .stat .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat .value{font-size:28px;font-weight:800;margin-top:4px}
  .stat.tai .value{color:var(--tai2)}
  .stat.xiu .value{color:var(--xiu2)}
  .bar{height:6px;border-radius:6px;background:#1e2748;margin-top:10px;overflow:hidden;display:flex}
  .bar i{display:block;height:100%}
  .bar .b-tai{background:linear-gradient(90deg,var(--tai),var(--tai2))}
  .bar .b-xiu{background:linear-gradient(90deg,var(--xiu),var(--xiu2))}

  /* ---------- LATEST ---------- */
  .latest{
    background:linear-gradient(160deg,var(--card),var(--bg2));
    border:1px solid var(--line);border-radius:20px;
    padding:20px;margin-bottom:16px;
    display:flex;flex-wrap:wrap;gap:20px;
    align-items:center;justify-content:space-between;
  }
  .latest-info{flex:1;min-width:180px}
  .latest-info .tag{
    font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase
  }
  .latest-info .result{
    font-size:clamp(30px,8vw,48px);font-weight:900;letter-spacing:2px;line-height:1.1;
  }
  .latest-info .result.tai{color:var(--tai2);text-shadow:0 0 24px rgba(255,77,79,.55)}
  .latest-info .result.xiu{color:var(--xiu2);text-shadow:0 0 24px rgba(47,123,255,.55)}
  .latest-info .sub{color:var(--muted);font-size:14px;margin-top:6px}
  .latest-info .sub b{color:var(--text)}
  .dice-big{display:flex;gap:12px}

  /* ---------- DICE ---------- */
  .dice{
    --s:34px;
    width:var(--s);height:var(--s);
    background:linear-gradient(160deg,#ffffff,#dfe6f7);
    border-radius:22%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:calc(var(--s)*0.13);
    gap:calc(var(--s)*0.05);
    box-shadow:0 6px 14px rgba(0,0,0,.45), inset 0 -2px 4px rgba(0,0,0,.15);
    flex:none;
  }
  .dice .pip{background:#101528;border-radius:50%;box-shadow:inset 0 1px 1px rgba(255,255,255,.35)}
  .dice-big .dice{--s:62px}
  @media(max-width:480px){ .dice-big .dice{--s:48px} }

  /* ---------- CONTROLS ---------- */
  .controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:16px;
  }
  .controls label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
  select,button{
    font-family:inherit;font-size:13px;color:var(--text);
    background:var(--bg2);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;cursor:pointer;transition:.2s;
  }
  select:hover,button:hover{border-color:var(--xiu2);background:#182votes}
  button:hover{background:#1b2categorical}
  button:hover{background:#1b2648}
  button.primary{background:linear-gradient(90deg,var(--xiu),var(--xiu2));border:none;font-weight:700}
  button.primary:hover{filter:brightness(1.12)}
  .countdown{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  /* ---------- TABLE ---------- */
  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;
  }
  .panel-head{
    padding:14px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    font-weight:700;font-size:14px;letter-spacing:.5px;
  }
  .panel-head span{color:var(--muted);font-weight:400;font-size:12px}
  .table-scroll{max-height:60vh;overflow:auto}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{
    position:sticky;top:0;z-index:2;
    background:#131b36;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:1px;
    padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);
  }
  tbody td{padding:9px 10px;border-bottom:1px solid #1b2440;vertical-align:middle}
  tbody tr:hover{background:#182bẫu}
  tbody tr:hover{background:#182142}
  tbody tr.new{animation:flash 1.4s ease-out}
  @keyframes flash{0%{background:#1e3a8a}100%{background:transparent}}
  .idx{color:var(--muted);font-variant-numeric:tabular-nums}
  .pill{
    display:inline-block;padding:4px 12px;border-radius:999px;
    font-weight:800;font-size:12px;letter-spacing:1px;min-width:56px;text-align:center;
  }
  .pill.tai{background:rgba(255,77,79,.16);color:var(--tai2);border:1px solid rgba(255,138,61,.4)}
  .pill.xiu{background:rgba(47,123,255,.16);color:var(--xiu2);border:1px solid rgba(57,197,255,.4)}
  .dice-cell{display:flex;gap:6px}
  .point{font-weight:800;font-variant-numeric:tabular-nums}
  .point.hi{color:#ffd166}
  .point.lo{color:#7dd3fc}

  /* ---------- MESSAGE ---------- */
  .msg{
    display:none;padding:14px 16px;border-radius:14px;margin-bottom:16px;
    font-size:14px;border:1px solid;line-height:1.5;
  }
  .msg.show{display:block}
  .msg.warn{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.4);color:#fcd34d}
  .msg.err{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 0}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>🎲 LỊCH SỬ PHIÊN TÀI XỈU</h1>
    <div class="status">
      <span class="dot load" id="statusDot"></span>
      <span id="statusText">Đang kết nối…</span>
    </div>
  </header>

  <div class="msg" id="msg"></div>

  <!-- THỐNG KÊ -->
  <section class="stats">
    <div class="stat tai">
      <div class="label">Tài</div>
      <div class="value" id="statTai">–</div>
    </div>
    <div class="stat xiu">
      <div class="label">Xỉu</div>
      <div class="value" id="statXiu">–</div>
    </div>
    <div class="stat">
      <div class="label">Tổng phiên</div>
      <div class="value" id="statTotal">–</div>
      <div class="bar">
        <i class="b-tai" id="barTai" style="width:50%"></i>
        <i class="b-xiu" id="barXiu" style="width:50%"></i>
      </div>
    </div>
    <div class="stat">
      <div class="label">Chuỗi hiện tại</div>
      <div class="value" id="statStreak">–</div>
    </div>
  </section>

  <!-- PHIÊN MỚI NHẤT -->
  <section class="latest">
    <div class="latest-info">
      <div class="tag">Phiên mới nhất</div>
      <div class="result" id="latestResult">–</div>
      <div class="sub">
        Mã phiên: <b id="latestId">–</b> &nbsp;•&nbsp;
        Tổng điểm: <b id="latestPoint">–</b>
      </div>
    </div>
    <div class="dice-big" id="latestDice"></div>
  </section>

  <!-- ĐIỀU KHIỂN -->
  <section class="controls">
    <button class="primary" id="btnRefresh">🔄 Làm mới</button>
    <label>
      <input type="checkbox" id="chkAuto" checked> Tự động
    </label>
    <label>
      Chu kỳ
      <select id="selInterval">
        <option value="5000">5 giây</option>
        <option value="10000" selected>10 giây</option>
        <option value="20000">20 giây</option>
        <option value="30000">30 giây</option>
        <option value="60000">60 giây</option>
      </select>
    </label>
    <span class="countdown" id="countdown">–</span>
  </section>

  <!-- BẢNG LỊCH SỬ -->
  <section class="panel">
    <div class="panel-head">
      Bảng lịch sử phiên
      <span id="lastUpdate">chưa cập nhật</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th style="width:70px">#</th>
            <th style="width:110px">Kết quả</th>
            <th>Xúc xắc</th>
            <th style="width:90px">Điểm</th>
            <th style="width:120px">Mã phiên</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">
            Đang tải dữ liệu…
          </td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <footer>Dữ liệu tự động cập nhật từ API • Tài (11–18) / Xỉu (3–10)</footer>
</div>

<script>
/* =========================================================
   1. CẤU HÌNH
   ========================================================= */
const API_BASE = "https://apiapi-k1ma.onrender.com";

/* Thử lần lượt các endpoint cho tới khi lấy được JSON hợp lệ */
const ENDPOINTS = [
  API_BASE,
  API_BASE + "/",
  API_BASE + "/api/history",
  API_BASE + "/api/lichsu",
  API_BASE + "/history",
  API_BASE + "/api"
];

/* Nếu API không bật CORS, dán proxy vào đây. Ví dụ:
   const PROXY = "https://corsproxy.io/?url=";  */
const PROXY = "";

const TIMEOUT_MS   = 30000;   // Render free cold-start có thể mất 30–50s
const RETRY_DELAY  = 6000;    // chờ trước khi thử lại khi lỗi
const CACHE_KEY    = "tx_history_cache_v1";

/* =========================================================
   2. DOM
   ========================================================= */
const $ = id => document.getElementById(id);
const el = {
  dot:$("statusDot"), status:$("statusText"), msg:$("msg"),
  statTai:$("statTai"), statXiu:$("statXiu"), statTotal:$("statTotal"), statStreak:$("statStreak"),
  barTai:$("barTai"), barXiu:$("barXiu"),
  latestResult:$("latestResult"), latestId:$("latestId"), latestPoint:$("latestPoint"),
  latestDice:$("latestDice"),
  btnRefresh:$("btnRefresh"), chkAuto:$("chkAuto"), selInterval:$("selInterval"),
  countdown:$("countdown"), lastUpdate:$("lastUpdate"), tbody:$("tbody")
};

/* =========================================================
   3. TIỆN ÍCH
   ========================================================= */
/* Vị trí các nút chấm trên mặt xúc xắc (lưới 3x3, đánh số 1..9) */
const PIP_MAP = {
  1:[5],
  2:[1,9],
  3:[1,5,9],
  4:[1,3,7,9],
  5:[1,3,5,7,9],
  6:[1,3,4,6,7,9]
};

function createDice(value){
  const d = document.createElement("div");
  d.className = "dice";
  const pips = PIP_MAP[value] || [];
  for(let i = 1; i <= 9; i++){
    if(!pips.includes(i)) continue;
    const p = document.createElement("span");
    p.className = "pip";
    p.style.gridColumn = ((i - 1) % 3) + 1;
    p.style.gridRow    = Math.floor((i - 1) / 3) + 1;
    d.appendChild(p);
  }
  return d;
}

function createDiceRow(dices){
  const box = document.createElement("div");
  box.className = "dice-cell";
  dices.forEach(v => box.appendChild(createDice(v)));
  return box;
}

function normalizeResult(r){
  const s = String(r || "").trim().toUpperCase();
  if(s === "TAI" || s === "TÀI") return "TAI";
  if(s === "XIU" || s === "XỈU") return "XIU";
  return s;
}

function setStatus(state, text){
  el.dot.className = "dot " + state;
  el.status.textContent = text;
}

function showMsg(type, html){
  el.msg.className = "msg show " + type;
  el.msg.innerHTML = html;
}
function hideMsg(){ el.msg.className = "msg"; }

function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString("vi-VN");
}

/* =========================================================
   4. GỌI API
   ========================================================= */
async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try{
    return await fetch(url, {
      signal: ctrl.signal,
      cache: "no-store",
      headers: { "Accept": "application/json" }
    });
  } finally {
    clearTimeout(t);
  }
}

async function getHistory(){
  let lastError = null;

  for(const url of ENDPOINTS){
    const finalUrl = PROXY ? PROXY + encodeURIComponent(url) : url;
    try{
      const res = await fetchWithTimeout(finalUrl, TIMEOUT_MS);

      if(!res.ok){
        lastError = `HTTP ${res.status}`;
        // 503 = server đang ngủ / khởi động -> vẫn thử endpoint khác
        continue;
      }

      const text = await res.text();
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ lastError = "Response không phải JSON"; continue; }

      if(data && Array.isArray(data.list) && data.list.length){
        return data;
      }
      lastError = "JSON thiếu trường 'list'";
    }catch(err){
      lastError = err.name === "AbortError"
        ? "Quá thời gian chờ (server đang khởi động)"
        : err.message;
    }
  }
  throw new Error(lastError || "Không lấy được dữ liệu");
}

/* =========================================================
   5. TÍNH TOÁN
   ========================================================= */
function computeStats(data){
  const list = data.list || [];

  let tai = 0, xiu = 0;
  if(data.typeStat && (data.typeStat.TAI != null || data.typeStat.XIU != null)){
    tai = Number(data.typeStat.TAI) || 0;
    xiu = Number(data.typeStat.XIU) || 0;
  }else{
    list.forEach(it => {
      const r = normalizeResult(it.resultTruyenThong);
      if(r === "TAI") tai++;
      else if(r === "XIU") xiu++;
    });
  }

  /* Chuỗi thắng liên tiếp tính từ phiên mới nhất (list[0]) */
  let streakType = "", streakLen = 0;
  if(list.length){
    streakType = normalizeResult(list[0].resultTruyenThong);
    for(const it of list){
      if(normalizeResult(it.resultTruyenThong) === streakType) streakLen++;
      else break;
    }
  }

  return { tai, xiu, total: tai + xiu || list.length, streakType, streakLen };
}

/* =========================================================
   6. RENDER
   ========================================================= */
let lastTopId = null;   // để highlight phiên mới

function render(data){
  const list = data.list || [];
  if(!list.length) return;

  /* --- Thống kê --- */
  const s = computeStats(data);
  el.statTai.textContent   = s.tai;
  el.statXiu.textContent   = s.xiu;
  el.statTotal.textContent = s.total;

  const pTai = s.total ? (s.tai / s.total) * 100 : 50;
  el.barTai.style.width = pTai.toFixed(1) + "%";
  el.barXiu.style.width = (100 - pTai).toFixed(1) + "%";

  if(s.streakLen){
    el.statStreak.textContent = `${s.streakType} ×${s.streakLen}`;
    el.statStreak.style.color = s.streakType === "TAI" ? "var(--tai2)" : "var(--xiu2)";
  }else{
    el.statStreak.textContent = "–";
  }

  /* --- Phiên mới nhất --- */
  const top = list[0];
  const topResult = normalizeResult(top.resultTruyenThong);

  el.latestResult.textContent = topResult;
  el.latestResult.className   = "result " + (topResult === "TAI" ? "tai" : "xiu");
  el.latestId.textContent     = top.id ?? "–";
  el.latestPoint.textContent  = top.point ?? "–";

  el.latestDice.innerHTML = "";
  (top.dices || []).forEach(v => el.latestDice.appendChild(createDice(v)));

  document.title = `${topResult} ${top.point ?? ""} điểm • Lịch sử Tài Xỉu`;

  /* --- Bảng lịch sử --- */
  const isNewTop = lastTopId !== null && String(lastTopId) !== String(top.id);
  lastTopId = top.id;

  const frag = document.createDocumentFragment();
  list.forEach((item, i) => {
    const r = normalizeResult(item.resultTruyenThong);
    const tr = document.createElement("tr");
    if(i === 0 && isNewTop) tr.className = "new";

    const tdIdx = document.createElement("td");
    tdIdx.className = "idx";
    tdIdx.textContent = i + 1;

    const tdRes = document.createElement("td");
    const pill = document.createElement("span");
    pill.className = "pill " + (r === "TAI" ? "tai" : "xiu");
    pill.textContent = r;
    tdRes.appendChild(pill);

    const tdDice = document.createElement("td");
    tdDice.appendChild(createDiceRow(item.dices || []));

    const tdPoint = document.createElement("td");
    tdPoint.className = "point " + ((item.point >= 11) ? "hi" : "lo");
    tdPoint.textContent = item.point ?? "–";

    const tdId = document.createElement("td");
    tdId.className = "idx";
    tdId.textContent = item.id ?? "–";

    tr.append(tdIdx, tdRes, tdDice, tdPoint, tdId);
    frag.appendChild(tr);
  });

  el.tbody.innerHTML = "";
  el.tbody.appendChild(frag);
  el.lastUpdate.textContent = "Cập nhật lúc " + timeNow();
}

/* =========================================================
   7. CACHE (hiển thị khi mất mạng)
   ========================================================= */
function saveCache(data){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), data })); }catch(e){}
}
function loadCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const obj = JSON.parse(raw);
    return obj && obj.data ? obj : null;
  }catch(e){ return null; }
}

/* =========================================================
   8. VÒNG LẶP TẢI DỮ LIỆU
   ========================================================= */
let timer = null;
let tickTimer = null;
let secondsLeft = 0;
let loading = false;

async function loadData(isAuto = false){
  if(loading) return;
  loading = true;

  if(!isAuto) setStatus("load", "Đang tải…");

  try{
    const data = await getHistory();
    render(data);
    saveCache(data);
    hideMsg();
    setStatus("ok", "Trực tuyến • " + timeNow());
  }catch(err){
    const cached = loadCache();

    if(cached){
      render(cached.data);
      setStatus("warn", "Mất kết nối • dùng dữ liệu lưu tạm");
      showMsg("warn",
        `⚠️ <b>Không gọi được API:</b> ${err.message}<br>
         Đang hiển thị dữ liệu lưu gần nhất (${new Date(cached.t).toLocaleTimeString("vi-VN")}).
         Hệ thống sẽ tự thử lại.`);
    }else{
      setStatus("err", "Lỗi kết nối");
      showMsg("err",
        `❌ <b>Không lấy được dữ liệu:</b> ${err.message}<br>
         <b>Gợi ý:</b> Server Render free có thể đang "ngủ" (lỗi 503) — hãy chờ 30–60 giây
         rồi bấm <b>Làm mới</b>, hoặc kiểm tra lại đường dẫn API.`);
      el.tbody.innerHTML =
        `<tr><td colspan="5" style="text-align:center;color:var(--muted);padding:30px">
          Không có dữ liệu</td></tr>`;
    }

    /* Tự thử lại sau RETRY_DELAY nếu bật tự động */
    if(el.chkAuto.checked){
      clearTimeout(timer);
      timer = setTimeout(() => loadData(true), RETRY_DELAY);
    }
  }finally{
    loading = false;
  }
}

/* Đếm ngược + tự động refresh */
function restartAuto(){
  clearInterval(timer);
  clearInterval(tickTimer);
  if(!el.chkAuto.checked){
    el.countdown.textContent = "đã tắt tự động";
    return;
  }
  const ms = Number(el.selInterval.value);
  secondsLeft = Math.round(ms / 1000);
  el.countdown.textContent = `tự động sau ${secondsLeft}s`;

  tickTimer = setInterval(() => {
    secondsLeft--;
    if(secondsLeft <= 0) secondsLeft = Math.round(ms / 1000);
    el.countdown.textContent = `tự động sau ${secondsLeft}s`;
  }, 1000);

  timer = setInterval(() => loadData(true), ms);
}

/* =========================================================
   9. SỰ KIỆN
   ========================================================= */
el.btnRefresh.addEventListener("click", () => loadData(false));
el.chkAuto.addEventListener("change", restartAuto);
el.selInterval.addEventListener("change", restartAuto);

/* Tự refresh khi quay lại tab */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden) loadData(true);
});

/* =========================================================
   10. KHỞI ĐỘNG
   ========================================================= */
(function init(){
  const cached = loadCache();
  if(cached){
    render(cached.data);
    setStatus("load", "Đang kết nối lại…");
  }
  loadData(false);
  restartAuto();
})();
</script>
</body>
</html>
